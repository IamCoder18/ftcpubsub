plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'com.aaravlabs'
version = '0.4.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/ftc-sdk-stub.jar')
    testCompileOnly files('libs/ftc-sdk-stub.jar')
    testRuntimeOnly files('libs/ftc-sdk-stub.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'Synapse'
                description = 'Annotation-driven pub/sub bus for FTC robot code with hardware-thread safety.'
                url = 'https://github.com/IamCoder18/synapse'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    url = 'https://github.com/IamCoder18/synapse'
                    connection = 'scm:git:git://github.com/IamCoder18/synapse.git'
                    developerConnection = 'scm:git:ssh://git@github.com/IamCoder18/synapse.git'
                }
                developers {
                    developer {
                        id = 'IamCoder18'
                        name = 'IamCoder18'
                    }
                }
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/IamCoder18/synapse'
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_USER') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

signing {
    def signingKey = findProperty('signing.key') ?: System.getenv('SIGNING_KEY')
    def signingPassphrase = findProperty('signing.password') ?: System.getenv('SIGNING_PASSWORD')
    if (signingKey && signingPassphrase) {
        useInMemoryPgpKeys(signingKey, signingPassphrase)
        sign publishing.publications.maven
    }
}

nexusPublishing {
    repositories {
        sonatype {
            // Sonatype Central staging API (OSSRH was sunset 2025-06-30).
            // The user-token username/password pair from central.sonatype.com
            // is read automatically from sonatypeUsername / sonatypePassword
            // properties (or SONATYPE_USERNAME / SONATYPE_PASSWORD env vars).
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/repository/maven-snapshots/'))
        }
    }
}
