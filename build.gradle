plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.aaravlabs'
version = '0.3.1'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/ftc-sdk-stub.jar')
    testCompileOnly files('libs/ftc-sdk-stub.jar')
    testRuntimeOnly files('libs/ftc-sdk-stub.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'Synapse'
                description = 'Annotation-driven pub/sub bus for FTC robot code with hardware-thread safety.'
                url = 'https://github.com/IamCoder18/synapse'
                licenses {
                    license {
                        name = 'MIT'
                    }
                }
                scm {
                    url = 'https://github.com/IamCoder18/synapse'
                    connection = 'scm:git:git://github.com/IamCoder18/synapse.git'
                    developerConnection = 'scm:git:ssh://git@github.com/IamCoder18/synapse.git'
                }
                developers {
                    developer {
                        id = 'IamCoder18'
                        name = 'IamCoder18'
                    }
                }
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/IamCoder18/synapse'
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_USER') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
