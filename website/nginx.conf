server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/markdown image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets get a year-long immutable cache.
    location ~* "\.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp|ico|webp)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML and AI-friendly text endpoints are revalidatable.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # Inject a `describedby` Link header pointing to the site llms.txt.
        add_header Link '</llms.txt>; rel="describedby"' always;
        # Markdown alternates for docs pages are announced via /<path>.md.
        try_files $uri $uri/ $uri.md $uri.html $uri/index.html /404.html;
    }

    # AI-friendly endpoints and search index — short cache.
    location ~* "^/(llms\.txt|llms-full\.txt|docs\.md|search\.json|api/search)$" {
        add_header Cache-Control "public, max-age=300";
    }

    # Health probe for compose.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
