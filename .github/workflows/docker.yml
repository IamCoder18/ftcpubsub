name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository_owner is the lowercased owner login, which GHCR treats
  # as the canonical package name (GitHub itself lowercases for the registry
  # path even when the org/repo display name preserves case).
  IMAGE_NAME: ${{ github.repository_owner }}/synapse-website

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    # Skip on PRs from forks (no GHCR write access) and on this repo's PRs
    # where we still want to verify the build succeeds without pushing.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          bake-target: synapse-website
          flavor: |
            latest=auto

      - name: Build (and push)
        uses: docker/bake-action@v5
        with:
          source: website
          files: |
            website/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: synapse-website
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pr:
    name: Build (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v5
        with:
          source: website
          files: |
            website/docker-bake.hcl
          targets: synapse-website
          push: false
          cache-from: type=gha
