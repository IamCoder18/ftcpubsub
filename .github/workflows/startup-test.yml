name: Startup test

on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Which secrets to reference'
        required: true
        type: choice
        options:
          - sonatype
          - gpg

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ inputs.which }}
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "ok"
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
