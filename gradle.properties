# Synapse — local Gradle config
#
# To publish to GitHub Packages you need a GitHub Personal Access Token (classic)
# with the `write:packages` scope. Generate one at:
#   https://github.com/settings/tokens/new
#
# The GitHub Packages repository URL is configured in build.gradle. If you fork
# Synapse and publish from a different GitHub account, update that URL (and the
# POM SCM fields) accordingly.
#
# Then uncomment and fill in the values below, or set GITHUB_TOKEN and
# GITHUB_ACTOR in the environment before running gradle publish:
#
# gpr.user=<your-github-username>
# gpr.key=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#
# To publish to Maven Central via Sonatype Central (OSS staging API, deprecated
# OSSRH was sunset 2025-06-30), generate a user token at
# https://central.sonatype.com/account and a GPG key for signing. The armored
# PGP private key is multi-line and cannot live in this .properties file; pass
# it via the SIGNING_KEY environment variable (the passphrase is single-line
# and can go in signing.password below if you prefer).
#
# sonatypeUsername=<token-username-from-central.sonatype.com>
# sonatypePassword=<token-secret>
# signing.password=<GPG passphrase>
#
# In CI these are wired to the GitHub Actions secrets SONATYPE_USERNAME,
# SONATYPE_PASSWORD, GPG_PRIVATE_KEY, and GPG_PASSPHRASE via the publish
# workflow.
